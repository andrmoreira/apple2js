<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=640">
    <title>Apple ][ Js - Emulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="case">
        <div class="lid">
            <img src="img/favicon.png" alt="Apple ][" class="apple-badge">
            Apple ][ Js - Emulator
        </div>
        <div class="bezel">
            <canvas id="crt" width="592" height="416"></canvas>
            <canvas id="screen" width="560" height="384"></canvas>
        </div>
        <div class="lower">
            <div class="drive" id="drive1">
                <div class="drive-slot"></div>
                <div class="drive-row">
                    <span class="led"></span>
                    <span class="drive-text">BLOAD/ROM</span>
                    <img src="img/favicon.png" alt="Apple" class="drive-logo">
                </div>
            </div>
        </div>
        <input type="file" id="rom" hidden>
        <div id="keyboard"></div>
    </div>
    <footer>
        Copyright 2026 André Moreira
    </footer>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <script src="src/rom.js"></script>
    <script src="submodules/apple2shader/screenEmu.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
